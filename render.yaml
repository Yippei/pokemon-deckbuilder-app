services:
  - type: web
    name: pokemon-deckbuilder-front
    runtime: node
    plan: free
    rootDir: front
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://pokemon-deckbuilder-app.onrender.com
